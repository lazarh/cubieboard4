header:
  version: 14

machine: cubieboard4
distro: poky
target: core-image-minimal

local_conf_header:
  debug-tweaks: |
    EXTRA_IMAGE_FEATURES += "debug-tweaks"
  wifi: |
    IMAGE_INSTALL:append = " kernel-module-brcmfmac linux-firmware-bcm43362 wpa-supplicant iw"

repos:
  poky:
    url: https://git.yoctoproject.org/poky
    commit: 1d54d1c4736a114e1cecbe85a0306e3814d5ce70
    branch: scarthgap
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded
    commit: ec0469748be4159fb83fb0fa0148d786484c88cf
    branch: scarthgap
    layers:
      meta-oe:
      meta-python:

  meta-arm:
    url: https://git.yoctoproject.org/meta-arm
    commit: a81c19915b5b9e71ed394032e9a50fd06919e1cd
    branch: scarthgap
    layers:
      meta-arm:
      meta-arm-toolchain:

  meta-sunxi:
    url: https://github.com/linux-sunxi/meta-sunxi
    commit: 5d0f71905afaa8a278ab44f47737e42131c4719f
    branch: scarthgap
    layers:
      .:

  meta-cubieboard4:
    path: meta-cubieboard4
    layers:
      .:
